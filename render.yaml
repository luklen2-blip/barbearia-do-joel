services:
  - type: web
    name: barbearia-do-joel
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm test
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: "Barbearia do Joel"
